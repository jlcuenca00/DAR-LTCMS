name: Refresh Composer Security Lock

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-composer-security-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Refresh affected production dependencies
        run: composer update laravel/framework league/flysystem --with-dependencies --no-interaction --prefer-dist

      - name: Verify production dependency audit
        run: composer audit --no-dev

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Refresh Composer security lock"
          git push origin HEAD:${{ github.head_ref }}
