name: Responsive Browser Regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'routes/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'ISO_IEC_25010_2023_SYSTEM_READINESS.md'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'playwright.config.mjs'
      - '.env.example'
      - '.github/workflows/responsive-e2e.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/refresh-production-demo-data.yml'
      - '.github/scripts/**'
      - 'seed_mock_*.txt'

permissions:
  contents: read

concurrency:
  group: responsive-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-browser-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dar_iland
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dar_iland"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dar_iland
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_STAFF_USERNAME: responsive.staff
      E2E_STAFF_PASSWORD: ResponsiveTest321!

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit production PHP dependencies
        run: composer audit --no-dev

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Run full Laravel test suite
        run: php artisan test

      - name: Create browser test Staff account
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $user = App\Models\User::query()->updateOrCreate(
              ['username' => 'responsive.staff'],
              [
                  'name' => 'Responsive Test Staff',
                  'email' => 'responsive.staff@example.test',
                  'password' => 'ResponsiveTest321!',
                  'role' => 'staff',
                  'is_active' => true,
                  'must_change_password' => false,
              ]
          );

          if (! Illuminate\Support\Facades\Hash::check('ResponsiveTest321!', $user->password)) {
              throw new RuntimeException('Responsive E2E Staff password was not stored correctly.');
          }
          PHP

      - name: Prepare isolated Geodetic directory browser fixtures
        run: php .github/scripts/prepare-geodetic-directory-e2e.php

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Laravel test server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &
          echo $! > /tmp/darltcms-e2e-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Run responsive browser matrix
        run: npx playwright test --config=playwright.config.mjs

      - name: Validate realistic agricultural demo seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d dar_iland -v ON_ERROR_STOP=1 -f seed_mock_dumaguete_nonoverlap_agri_data.txt
          psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT md5(jsonb_agg(to_jsonb(a) ORDER BY a.id)::text) FROM land_transfer_applications a WHERE application_code LIKE '2026-NOR-DEMO-%';" > /tmp/demo-before.txt
          psql -h 127.0.0.1 -U postgres -d dar_iland -v ON_ERROR_STOP=1 -f seed_mock_dumaguete_nonoverlap_agri_data.txt
          psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT md5(jsonb_agg(to_jsonb(a) ORDER BY a.id)::text) FROM land_transfer_applications a WHERE application_code LIKE '2026-NOR-DEMO-%';" > /tmp/demo-after.txt
          cmp /tmp/demo-before.txt /tmp/demo-after.txt
          test "$(psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT COUNT(*) FROM parcels WHERE parcel_code LIKE 'NOR-AGRI-%';")" = "16"
          test "$(psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT COUNT(*) FROM land_transfer_applications WHERE application_code LIKE '2026-NOR-DEMO-%' AND status IN ('approved','not_approved');")" = "5"
          test "$(psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT COUNT(*) FROM land_transfer_applications WHERE application_code LIKE '2026-NOR-DEMO-%' AND amount_paid IS NOT NULL AND amount_paid <> 2000.00;")" = "0"

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: responsive-playwright-report
          path: |
            playwright-report/
            test-results/
            storage/logs/e2e-server.log
          if-no-files-found: ignore
          retention-days: 7
