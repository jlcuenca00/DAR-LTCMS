name: Responsive Browser Regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - 'ISO_IEC_25010_2023_SYSTEM_READINESS.md'
      - 'docs/**'
      - 'resources/css/**'
      - 'resources/js/**'
      - 'resources/views/**'
      - 'app/Http/Controllers/Staff/StaffDashboardController.php'
      - 'app/Http/Controllers/Staff/MonitoringReportController.php'
      - 'app/Http/Controllers/Staff/ParcelMapController.php'
      - 'app/Http/Controllers/Geodetic/ParcelMapController.php'
      - 'app/Http/Controllers/Geodetic/GeodeticPortalController.php'
      - 'app/Http/Controllers/Landowner/ParcelMapController.php'
      - 'app/Http/Controllers/Landowner/LandownerDashboardController.php'
      - 'app/Http/Controllers/Landowner/LandownerPortalController.php'
      - 'app/Http/Controllers/ProfileController.php'
      - 'app/Http/Controllers/Staff/ApplicationClearanceController.php'
      - 'app/Http/Controllers/Staff/ProtectedStorageController.php'
      - 'app/Http/Controllers/Landowner/ApplicationClearanceController.php'
      - 'app/Http/Controllers/Staff/ApplicationWorkflowController.php'
      - 'app/Http/Controllers/Staff/LandTransferApplicationController.php'
      - 'app/Http/Controllers/Staff/ApplicationDocumentController.php'
      - 'app/Http/Controllers/Staff/ApplicationLandownerLinkController.php'
      - 'app/Http/Middleware/LockApplicationMutation.php'
      - 'app/Http/Middleware/EnsureMutationAudited.php'
      - 'app/Http/Middleware/SecurityHeaders.php'
      - 'app/Http/Middleware/TrustHosts.php'
      - 'app/Http/Middleware/TrustProxies.php'
      - 'app/Models/AuditLog.php'
      - 'app/Providers/AppServiceProvider.php'
      - 'app/Services/AuditLogger.php'
      - 'app/Services/ApplicationClearanceService.php'
      - 'app/Services/ProductionReadinessScanner.php'
      - 'config/app.php'
      - 'config/filesystems.php'
      - 'config/onboarding.php'
      - 'config/session.php'
      - 'database/migrations/**'
      - 'bootstrap/app.php'
      - 'routes/console.php'
      - '.env.example'
      - '.github/workflows/deploy.yml'
      - 'tests/Feature/*Responsive*'
      - 'tests/Feature/*MobilePortal*'
      - 'tests/Feature/*Map*'
      - 'tests/Feature/OnboardingTourTest.php'
      - 'tests/Feature/UiUxSystemTest.php'
      - 'tests/Feature/ApplicationModalViewportTest.php'
      - 'tests/Feature/DashboardAttentionTest.php'
      - 'tests/Feature/ClearancePrintReferenceTest.php'
      - 'tests/Feature/FinalLtcForm5Test.php'
      - 'tests/Feature/ReleasePreparationTest.php'
      - 'tests/Feature/DocumentationAlignmentTest.php'
      - 'tests/Feature/PresentationDemoAndUiPolishTest.php'
      - 'tests/Feature/MonitoringReportTest.php'
      - 'tests/Feature/SecurityHeadersTest.php'
      - 'tests/Feature/ProductionSecurityHardeningTest.php'
      - 'tests/Feature/PerformanceHardeningTest.php'
      - 'tests/Feature/FinalUatTest.php'
      - 'tests/Feature/GeodeticReadOnlyTest.php'
      - 'tests/Feature/LandownerParcelMapViewerTest.php'
      - 'tests/Feature/ProfilePhotoDeliveryTest.php'
      - 'tests/Feature/RecordSearchPagesTest.php'
      - 'tests/Feature/ApplicationSearchFilterTest.php'
      - 'tests/Feature/FinalDecisionLockTest.php'
      - 'tests/Feature/FinalDecisionIntegrityHardeningTest.php'
      - 'tests/Feature/RbacSecurityHardeningTest.php'
      - 'tests/Feature/ApplicationWorkflowReadinessTest.php'
      - 'tests/Feature/HectareValidationWorkflowTest.php'
      - 'tests/Feature/NotificationSystemTest.php'
      - 'tests/Feature/AuditLoggingTest.php'
      - 'tests/Feature/AuditLogIntegrityHardeningTest.php'
      - 'tests/Feature/BetaSystemRegressionTest.php'
      - 'tests/Feature/DataIntegrityHardeningTest.php'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - '.github/workflows/responsive-e2e.yml'

permissions:
  contents: read

concurrency:
  group: responsive-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-browser-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dar_iland
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dar_iland"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dar_iland
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_STAFF_USERNAME: responsive.staff
      E2E_STAFF_PASSWORD: ResponsiveTest321!

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit production PHP dependencies
        run: composer audit --no-dev

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Run final UAT, Form 5, release, documentation, presentation, security, workflow, reports, performance, and integrity tests
        run: |
          php artisan test \
            tests/Feature/ResponsiveUiFoundationTest.php \
            tests/Feature/StaffMobilePortalNavigationTest.php \
            tests/Feature/RoleMobilePortalNavigationTest.php \
            tests/Feature/OnboardingTourTest.php \
            tests/Feature/ApplicationReviewResponsiveHardeningTest.php \
            tests/Feature/ApplicationModalViewportTest.php \
            tests/Feature/ParcelMapResponsiveHardeningTest.php \
            tests/Feature/StaffParcelMapResilienceTest.php \
            tests/Feature/LandownerMapUiCleanupTest.php \
            tests/Feature/UiUxSystemTest.php \
            tests/Feature/ClearancePrintReferenceTest.php \
            tests/Feature/FinalLtcForm5Test.php \
            tests/Feature/ReleasePreparationTest.php \
            tests/Feature/DocumentationAlignmentTest.php \
            tests/Feature/PresentationDemoAndUiPolishTest.php \
            tests/Feature/DashboardAttentionTest.php \
            tests/Feature/MonitoringReportTest.php \
            tests/Feature/SecurityHeadersTest.php \
            tests/Feature/ProductionSecurityHardeningTest.php \
            tests/Feature/PerformanceHardeningTest.php \
            tests/Feature/FinalUatTest.php \
            tests/Feature/GeodeticReadOnlyTest.php \
            tests/Feature/LandownerParcelMapViewerTest.php \
            tests/Feature/ProfilePhotoDeliveryTest.php \
            tests/Feature/RecordSearchPagesTest.php \
            tests/Feature/ApplicationSearchFilterTest.php \
            tests/Feature/RbacSecurityHardeningTest.php \
            tests/Feature/FinalDecisionLockTest.php \
            tests/Feature/FinalDecisionIntegrityHardeningTest.php \
            tests/Feature/ApplicationWorkflowReadinessTest.php \
            tests/Feature/HectareValidationWorkflowTest.php \
            tests/Feature/NotificationSystemTest.php \
            tests/Feature/AuditLoggingTest.php \
            tests/Feature/AuditLogIntegrityHardeningTest.php \
            tests/Feature/BetaSystemRegressionTest.php \
            tests/Feature/DataIntegrityHardeningTest.php

      - name: Create browser test Staff account
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $user = App\Models\User::query()->updateOrCreate(
              ['username' => 'responsive.staff'],
              [
                  'name' => 'Responsive Test Staff',
                  'email' => 'responsive.staff@example.test',
                  'password' => 'ResponsiveTest321!',
                  'role' => 'staff',
                  'is_active' => true,
                  'must_change_password' => false,
              ]
          );

          if (! Illuminate\Support\Facades\Hash::check('ResponsiveTest321!', $user->password)) {
              throw new RuntimeException('Responsive E2E Staff password was not stored correctly.');
          }
          PHP

      - name: Install Playwright after build
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Laravel test server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &
          echo $! > /tmp/darltcms-e2e-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Run responsive browser matrix
        run: npx playwright test --config=playwright.config.mjs

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-playwright-report
          path: |
            playwright-report/
            test-results/
            storage/logs/e2e-server.log
          if-no-files-found: ignore
          retention-days: 7
