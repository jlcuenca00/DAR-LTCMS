name: Deploy DAR-LTCMS to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darltcms-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dar_iland
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dar_iland"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dar_iland
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_STAFF_USERNAME: deployment.verify.staff

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify production backup safeguards
        run: |
          python3 .github/scripts/test-production-backup.py
          python3 .github/scripts/test-production-backup-alert.py

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Check backup alert PHP syntax
        run: php -l scripts/send_production_backup_alert.php

      - name: Install and audit PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer audit --no-dev

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Verify isolated PostgreSQL rollback and recovery
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash .github/scripts/verify-database-recovery.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, audit, and build frontend assets
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Run full Laravel test suite
        run: php artisan test

      - name: Prepare isolated browser-test credential
        run: |
          TEST_PASSWORD="$(openssl rand -hex 16)Aa1!"
          echo "E2E_STAFF_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"

      - name: Create deployment browser-test Staff account
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          App\Models\User::query()->updateOrCreate(
              ['username' => getenv('E2E_STAFF_USERNAME')],
              [
                  'name' => 'Deployment Verification Staff',
                  'email' => 'deployment.verify.staff@example.test',
                  'password' => getenv('E2E_STAFF_PASSWORD'),
                  'role' => 'staff',
                  'is_active' => true,
                  'must_change_password' => false,
                  'temporary_password_expires_at' => null,
              ]
          );
          PHP

      - name: Prepare isolated Geodetic directory browser fixtures
        run: php .github/scripts/prepare-geodetic-directory-e2e.php

      - name: Prepare isolated application review browser fixture
        run: php .github/scripts/prepare-application-review-e2e.php

      - name: Prepare isolated browser journey fixtures
        run: php .github/scripts/prepare-browser-journeys.php

      - name: Verify journey verifier rejects unfinished fixtures
        run: |
          if php .github/scripts/verify-browser-journeys.php > storage/logs/browser-journey-guard.log 2>&1; then
            cat storage/logs/browser-journey-guard.log
            echo "::error::Unfinished browser journeys must fail verification."
            exit 1
          fi
          echo "Unfinished browser journeys correctly rejected with a nonzero exit."

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Laravel test server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/deploy-verify-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/deploy-verify-server.log
          exit 1

      - name: Run responsive browser matrix
        run: npx playwright test --config=playwright.config.mjs

      - name: Verify persisted browser journeys and protected records
        run: php .github/scripts/verify-browser-journeys.php

      - name: Validate realistic agricultural demo seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d dar_iland -v ON_ERROR_STOP=1 -f seed_mock_dumaguete_nonoverlap_agri_data.txt
          psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT md5(jsonb_agg(to_jsonb(a) ORDER BY a.id)::text) FROM land_transfer_applications a WHERE application_code LIKE '2026-NOR-DEMO-%';" > /tmp/demo-before.txt
          psql -h 127.0.0.1 -U postgres -d dar_iland -v ON_ERROR_STOP=1 -f seed_mock_dumaguete_nonoverlap_agri_data.txt
          psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT md5(jsonb_agg(to_jsonb(a) ORDER BY a.id)::text) FROM land_transfer_applications a WHERE application_code LIKE '2026-NOR-DEMO-%';" > /tmp/demo-after.txt
          cmp /tmp/demo-before.txt /tmp/demo-after.txt
          test "$(psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT COUNT(*) FROM parcels WHERE parcel_code LIKE 'NOR-AGRI-%';")" = "16"
          test "$(psql -h 127.0.0.1 -U postgres -d dar_iland -Atc "SELECT COUNT(*) FROM land_transfer_applications WHERE application_code LIKE '2026-NOR-DEMO-%' AND status IN ('approved','not_approved');")" = "5"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://darltcms.me

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # TEMPORARY AUDIT/DEFENSE MODE:
      # Strict host-key pinning is intentionally deferred until post-defense hardening.
      - name: Deploy to CloudPanel
        uses: easingthemes/ssh-deploy@ece05a22752e524363164bfb2f69a5ba4f8ded0d # v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: "22"

          SOURCE: "./"
          TARGET: "/home/darltcms/htdocs/darltcms.me"

          ARGS: "-rlzvc"

          EXCLUDE: >-
            /.git/,
            /.github/,
            /.env,
            /node_modules/,
            /vendor/,
            /tests/,
            /storage/backups/,
            /storage/app/private/,
            /storage/app/public/,
            /storage/logs/,
            /storage/framework/cache/data/,
            /storage/framework/sessions/,
            /storage/framework/views/,
            /public/storage/,
            /*.sql,
            /*_audit.txt,
            /seed_mock_*.txt

          # Enter maintenance with the existing application before rsync starts.
          SCRIPT_BEFORE: |
            set -euo pipefail
            cd /home/darltcms/htdocs/darltcms.me
            test -f .env
            test -f vendor/autoload.php
            if [ -f storage/framework/down ]; then
              echo "Application is already in maintenance. Resolve the existing maintenance state before deploying."
              exit 1
            fi
            php artisan down --retry=60 --render="errors::503"
            test -f storage/framework/down
          SCRIPT_BEFORE_REQUIRED: true

          SCRIPT_AFTER: |
            set -euo pipefail

            cd /home/darltcms/htdocs/darltcms.me

            fail_closed() {
              deployment_status=$?
              if [ "$deployment_status" -ne 0 ]; then
                echo "Deployment failed. Maintenance is retained; inspect this run before recovery."
                php artisan down --retry=60 --render="errors::503" || true
              fi
              exit "$deployment_status"
            }
            trap fail_closed EXIT

            test -f .env || {
              echo "Production .env is missing."
              exit 1
            }

            php -m | grep -q pdo_pgsql || {
              echo "PHP PostgreSQL driver is missing."
              exit 1
            }

            mkdir -p bootstrap/cache
            mkdir -p storage/app/private
            mkdir -p storage/app/public
            mkdir -p storage/fonts
            mkdir -p storage/logs
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views

            chmod -R ug+rwX bootstrap/cache storage/app/private storage/fonts storage/logs storage/framework

            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            php artisan migrate --force
            # Preserve runtime cache, including active authentication throttles.

            # Source-package scans and application documents are administrative
            # records. They must never be exposed through a public storage symlink.
            if [ -L public/storage ]; then
              rm public/storage
            elif [ -e public/storage ]; then
              echo "public/storage exists but is not a symbolic link. Refusing to leave an unknown public storage path in production."
              exit 1
            fi

            test ! -e public/storage && test ! -L public/storage || {
              echo "public/storage must not exist in production."
              exit 1
            }

            test -w storage/app/private || {
              echo "storage/app/private is not writable by the deployment user."
              exit 1
            }

            test -r storage/app/public || {
              echo "storage/app/public is not readable for legacy migration."
              exit 1
            }

            # New administrative uploads use storage/app/private. During deployment,
            # temporarily allow the owner to remove registered legacy copies, migrate
            # and verify them, then lock the fallback directory read-only at runtime.
            chmod -R u+rwX storage/app/public
            php artisan dar:migrate-legacy-private-storage
            chmod -R a-w storage/app/public

            if find storage/app/public -type f -print -quit | grep -q .; then
              echo "Unregistered legacy files remain under storage/app/public. They are preserved read-only for manual review."
            fi

            test -w storage/fonts || {
              echo "storage/fonts is not writable by the deployment user."
              exit 1
            }

            # Blocks unsafe runtime settings (debug, HTTP URL, insecure session
            # cookies, public document exposure, etc.). Delivery/logging warnings
            # are reported but do not interrupt routine deployment; --strict is
            # reserved for the final v1.0 release gate.
            php artisan dar:check-production-readiness

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R ug+rwX bootstrap/cache storage/app/private storage/fonts storage/logs storage/framework

            php artisan about
            php artisan migrate:status

            bash scripts/finalize_production_deployment.sh "$PWD" '${{ github.sha }}'

          SCRIPT_AFTER_REQUIRED: true
