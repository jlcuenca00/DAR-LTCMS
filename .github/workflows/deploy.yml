name: Deploy DAR-LTCMS to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darltcms-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy to CloudPanel
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: "22"

          SOURCE: "./"
          TARGET: "/home/darltcms/htdocs/darltcms.me"

          ARGS: "-rlzvc"

          EXCLUDE: >-
            /.git/,
            /.github/,
            /.env,
            /node_modules/,
            /vendor/,
            /tests/,
            /storage/backups/,
            /storage/app/private/,
            /storage/app/public/,
            /storage/logs/,
            /storage/framework/cache/data/,
            /storage/framework/sessions/,
            /storage/framework/views/,
            /public/storage/,
            /*.sql,
            /*_audit.txt,
            /seed_mock_*.txt

          SCRIPT_AFTER: |
            set -e

            cd /home/darltcms/htdocs/darltcms.me

            test -f .env || {
              echo "Production .env is missing."
              exit 1
            }

            php -m | grep -q pdo_pgsql || {
              echo "PHP PostgreSQL driver is missing."
              exit 1
            }

            mkdir -p bootstrap/cache
            mkdir -p storage/app/private
            mkdir -p storage/app/public
            mkdir -p storage/fonts
            mkdir -p storage/logs
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views

            chmod -R ug+rwX storage bootstrap/cache

            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            php artisan migrate --force
            php artisan cache:clear

            # Source-package scans and application documents are administrative
            # records. They must never be exposed through a public storage symlink.
            if [ -L public/storage ]; then
              rm public/storage
            elif [ -e public/storage ]; then
              echo "public/storage exists but is not a symbolic link. Refusing to leave an unknown public storage path in production."
              exit 1
            fi

            test ! -e public/storage && test ! -L public/storage || {
              echo "public/storage must not exist in production."
              exit 1
            }

            test -w storage/app/private || {
              echo "storage/app/private is not writable by the deployment user."
              exit 1
            }

            test -w storage/app/public || {
              echo "storage/app/public is not writable by the deployment user."
              exit 1
            }

            test -w storage/fonts || {
              echo "storage/fonts is not writable by the deployment user."
              exit 1
            }

            # Blocks unsafe runtime settings (debug, HTTP URL, insecure session
            # cookies, public document exposure, etc.). Delivery/logging warnings
            # are reported but do not interrupt routine deployment; --strict is
            # reserved for the final v1.0 release gate.
            php artisan dar:check-production-readiness

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R ug+rwX storage bootstrap/cache

            php artisan about
            php artisan migrate:status

            # Production intentionally excludes .git. Persist the exact deployed
            # source revision so backups can retain application-version traceability.
            printf '%s\n' '${{ github.sha }}' > .release-commit
            chmod 644 .release-commit
            echo "Recorded deployed commit: $(cat .release-commit)"

          SCRIPT_AFTER_REQUIRED: true