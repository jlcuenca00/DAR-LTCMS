name: Deploy DAR-LTCMS to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darltcms-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dar_iland
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dar_iland"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dar_iland
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Install and audit PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer audit --no-dev

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, audit, and build frontend assets
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Run full Laravel test suite
        run: php artisan test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://darltcms.me

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy to CloudPanel
        uses: easingthemes/ssh-deploy@ece05a22752e524363164bfb2f69a5ba4f8ded0d # v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: "22"

          SOURCE: "./"
          TARGET: "/home/darltcms/htdocs/darltcms.me"

          ARGS: "-rlzvc"

          EXCLUDE: >-
            /.git/,
            /.github/,
            /.env,
            /node_modules/,
            /vendor/,
            /tests/,
            /storage/backups/,
            /storage/app/private/,
            /storage/app/public/,
            /storage/logs/,
            /storage/framework/cache/data/,
            /storage/framework/sessions/,
            /storage/framework/views/,
            /public/storage/,
            /*.sql,
            /*_audit.txt,
            /seed_mock_*.txt

          SCRIPT_AFTER: |
            set -e

            cd /home/darltcms/htdocs/darltcms.me

            test -f .env || {
              echo "Production .env is missing."
              exit 1
            }

            php -m | grep -q pdo_pgsql || {
              echo "PHP PostgreSQL driver is missing."
              exit 1
            }

            mkdir -p bootstrap/cache
            mkdir -p storage/app/private
            mkdir -p storage/app/public
            mkdir -p storage/fonts
            mkdir -p storage/logs
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views

            chmod -R ug+rwX bootstrap/cache storage/app/private storage/fonts storage/logs storage/framework

            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            php artisan migrate --force
            php artisan cache:clear

            # Source-package scans and application documents are administrative
            # records. They must never be exposed through a public storage symlink.
            if [ -L public/storage ]; then
              rm public/storage
            elif [ -e public/storage ]; then
              echo "public/storage exists but is not a symbolic link. Refusing to leave an unknown public storage path in production."
              exit 1
            fi

            test ! -e public/storage && test ! -L public/storage || {
              echo "public/storage must not exist in production."
              exit 1
            }

            test -w storage/app/private || {
              echo "storage/app/private is not writable by the deployment user."
              exit 1
            }

            test -r storage/app/public || {
              echo "storage/app/public is not readable for legacy migration."
              exit 1
            }

            # New administrative uploads use storage/app/private. During deployment,
            # temporarily allow the owner to remove registered legacy copies, migrate
            # and verify them, then lock the fallback directory read-only at runtime.
            chmod -R u+rwX storage/app/public
            php artisan dar:migrate-legacy-private-storage
            chmod -R a-w storage/app/public

            if find storage/app/public -type f -print -quit | grep -q .; then
              echo "Unregistered legacy files remain under storage/app/public. They are preserved read-only for manual review."
            fi

            test -w storage/fonts || {
              echo "storage/fonts is not writable by the deployment user."
              exit 1
            }

            # Blocks unsafe runtime settings (debug, HTTP URL, insecure session
            # cookies, public document exposure, etc.). Delivery/logging warnings
            # are reported but do not interrupt routine deployment; --strict is
            # reserved for the final v1.0 release gate.
            php artisan dar:check-production-readiness

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R ug+rwX bootstrap/cache storage/app/private storage/fonts storage/logs storage/framework

            php artisan about
            php artisan migrate:status

            # Production intentionally excludes .git. Persist the exact deployed
            # source revision so backups can retain application-version traceability.
            printf '%s\n' '${{ github.sha }}' > .release-commit
            chmod 644 .release-commit
            echo "Recorded deployed commit: $(cat .release-commit)"

          SCRIPT_AFTER_REQUIRED: true